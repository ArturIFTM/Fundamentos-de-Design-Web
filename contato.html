<body>

    <header>
        <div class="caixa">
            <h1>Educação Virtual Brasil</h1>

                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalogo.html">Catálogo de Aulas</a></li>

    <div class="caixa-conteudo">
        <h2>Entre em Contato</h2>
        <p>Tem alguma dúvida, sugestão ou quer contribuir com o projeto? Fale conosco!</p>

        <form>
            <label for="nome">Nome e sobrenome</label>
            <input type="text" id="nome">

            <label for="email">Email</label>
            <input type="text" id="email">

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone">

            <label for="mensagem">Mensagem</label>
            <textarea cols="70" rows="10" id="mensagem"></textarea>

            <input type="submit" value="Enviar formulário">
        </form>
    </div>

    <div class="caixa-conteudo mapa">
        <h2>Nossa Localização</h2>
        <p>Estamos localizados no IFTM - Campus Avançado Uberaba Parque Tecnológico.</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3755.8583231546!2d-47.9599624847304!3d-19.71865508672245!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bad18160f7b4d3%3A0x5d0c29cbc9d3e469!2sIFTM%20-%20Uberaba%20(Parque%20Tecnol%C3%B3gico)!5e0!3m2!1spt-BR!2sbr!4v1588686900348!5m2!1spt-BR!2sbr" width="600" height="450" frameborder="0" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
    </div>
